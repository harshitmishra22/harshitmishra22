<svg width="1500" height="400" viewBox="0 0 1500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0E1A1F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A9D8F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2A9D8F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#2A9D8F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="400" fill="url(#bg)"/>
  <rect width="700" height="400" fill="url(#glow)"/>

  <!-- Subtle circuit/line motif on the right -->
  <g stroke="#1F3A3E" stroke-width="2" fill="none" opacity="0.9">
    <path d="M950 60 L1080 60 L1080 140 L1200 140"/>
    <circle cx="1080" cy="60" r="5" fill="#2A9D8F"/>
    <circle cx="1200" cy="140" r="5" fill="#2A9D8F"/>
    <path d="M1000 220 L1000 300 L1150 300 L1150 360"/>
    <circle cx="1000" cy="220" r="5" fill="#2A9D8F"/>
    <circle cx="1150" cy="360" r="5" fill="#2A9D8F"/>
    <path d="M1250 40 L1250 200 L1380 200"/>
    <circle cx="1250" cy="40" r="5" fill="#2A9D8F"/>
    <circle cx="1380" cy="200" r="5" fill="#2A9D8F"/>
    <path d="M1350 250 L1420 250 L1420 340"/>
    <circle cx="1420" cy="340" r="5" fill="#2A9D8F"/>
    <path d="M900 320 L980 320 L980 370"/>
    <circle cx="900" cy="320" r="4" fill="#0E4D64"/>
  </g>

  <!-- Braces motif -->
  <text x="1230" y="230" font-family="JetBrains Mono, monospace" font-size="150" fill="#132226" opacity="0.6">{ }</text>

  <!-- Accent line under name -->
  <rect x="80" y="215" width="160" height="4" fill="url(#accentLine)"/>

  <!-- Text -->
  <text x="80" y="170" font-family="Sora, Inter, sans-serif" font-size="56" font-weight="700" fill="#F4EDE1">Harshit Mishra</text>
  <text x="80" y="205" font-family="Inter, sans-serif" font-size="24" fill="#2A9D8F" letter-spacing="1">JAVA BACKEND DEVELOPER</text>

  <text x="80" y="260" font-family="Inter, sans-serif" font-size="18" fill="#8B98A5">B.Tech IT · Final Year</text>
  <text x="80" y="290" font-family="Inter, sans-serif" font-size="18" fill="#8B98A5">Java &#183; OOP &#183; DSA &#183; Spring Boot &#183; REST APIs</text>

  <!-- small dot separator accents -->
  <circle cx="80" cy="330" r="4" fill="#2A9D8F"/>
  <text x="95" y="336" font-family="Inter, sans-serif" font-size="15" fill="#5C6773">Building toward production-grade backend systems</text>
</svg>
